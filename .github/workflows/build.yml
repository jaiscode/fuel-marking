# Builds and tests the desktop app on Windows, Linux and macOS, and runs the installation self-check on each.
# NOTE: written by the author on a Mac and NEVER RUN (there was no GitHub or Windows machine to run it on). Expect to adjust
# it on first use - most likely the PostgreSQL step. Its value is that a Windows result will exist as soon as it is pushed.
name: desktop
on: [push, pull_request]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DB_URL: jdbc:postgresql://localhost:5432/fuel_marking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: ankane/setup-postgres@v1
        with: { postgres-version: '16', database: fuel_marking }

      - name: Linux needs a display for JavaFX
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgl1

      - name: Build the jar for this operating system
        run: mvn -B -DskipTests package

      - name: Installation self-check (does the JavaFX graphics toolkit start on this OS?)
        shell: bash
        run: |
          RUN="java -Ddatabase.url=$DB_URL -Ddatabase.username=postgres -Ddatabase.password=postgres -jar target/fuel-marking-desktop.jar --selfcheck"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a $RUN; else $RUN; fi

      - name: Tests (database, services, sync, scale, every JavaFX screen)
        shell: bash
        run: |
          ARGS="-Ddatabase.url=$DB_URL -Ddatabase.username=postgres -Ddatabase.password=postgres"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a mvn -B test -Dtest='*IT,*Test' -DargLine="$ARGS"; else mvn -B test -Dtest='*IT,*Test' -DargLine="$ARGS"; fi

      - name: Keep the jar and the UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/fuel-marking-desktop.jar
            target/ui-shots/*.png
