# The one database every backend integration test (*IT) uses. Defaults suit a throwaway local PostgreSQL with trust
# authentication on port 55432 (see the README, "Tests"); point the tests elsewhere with environment variables:
#   IT_DB_URL (default jdbc:postgresql://localhost:55432/fuel_central_test), IT_DB_USER (default postgres),
#   IT_DB_PASSWORD (default empty - never commit a password here).
spring.datasource.url=${IT_DB_URL:jdbc:postgresql://localhost:55432/fuel_central_test}
spring.datasource.username=${IT_DB_USER:postgres}
spring.datasource.password=${IT_DB_PASSWORD:}
